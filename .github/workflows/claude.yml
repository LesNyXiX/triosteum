# Общий чат «владелец + Claude + Codex» в задачах (Issues) GitHub — без платных API.
# Claude отвечает, когда в задаче или комментарии есть «@claude»; работает по подписке владельца
# (секрет CLAUDE_CODE_OAUTH_TOKEN из `claude setup-token`), а не по платному ключу API.
# Codex отвечает на «@codex» сам, через своё приложение GitHub (по подписке ChatGPT).
# Вызвать Claude может только владелец репозитория — чужие упоминания не тратят подписку.
name: Claude в задачах

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    name: Claude
    if: >-
      github.actor == github.repository_owner && (
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))) ||
        (github.event_name != 'issues' && contains(github.event.comment.body, '@claude'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 60
            --append-system-prompt "Ты — Claude, второй разработчик Triosteum. Отвечай владельцу по-русски, коротко и по делу. Следуй AGENTS.md и CLAUDE.md. Код меняй только в ветке claude/… через PR в main (в main напрямую не пушь), docs/index.html не коммить (он собирается автоматически), для проверки — node build.mjs. Если задачу удобнее отдать Codex — так и скажи владельцу; сам Codex не вызывай. Ничего платного не подключай, секреты не печатай."
