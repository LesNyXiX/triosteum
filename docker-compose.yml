# Triosteum целиком: база PostgreSQL + сервер.
#   cp .env.example .env    (поменяйте пароли!)
#   docker compose up -d --build
#   → http://localhost:8000
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: triosteum
      POSTGRES_USER: triosteum_owner
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?задайте DB_OWNER_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triosteum_owner -d triosteum"]
      interval: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # владелец схемы — только для миграций при запуске
      MIGRATE_DATABASE_URL: postgresql://triosteum_owner:${DB_OWNER_PASSWORD}@db:5432/triosteum
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?задайте APP_DB_PASSWORD в .env}
      # приложение работает ролью без права обходить построчную защиту
      DATABASE_URL: postgresql+psycopg://triosteum_app:${APP_DB_PASSWORD}@db:5432/triosteum
      COOKIE_SECURE: ${COOKIE_SECURE:-1}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      # ИИ: пусто — выключен; openai — своя модель (Ollama/vLLM); yandex — YandexGPT по ключу
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_BASE_URL: ${AI_BASE_URL:-http://ollama:11434/v1}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      YANDEX_API_KEY: ${YANDEX_API_KEY:-}
      YANDEX_FOLDER_ID: ${YANDEX_FOLDER_ID:-}
    ports:
      - "${PORT:-8000}:8000"

  # своя модель на этом же сервере (нужна видеокарта NVIDIA или много памяти):
  #   docker compose --profile ai up -d
  #   docker compose exec ollama ollama pull qwen2.5-coder:14b
  # и в .env: AI_PROVIDER=openai, AI_MODEL=qwen2.5-coder:14b
  ollama:
    image: ollama/ollama
    profiles: ["ai"]
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    # для видеокарты NVIDIA раскомментируйте:
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

volumes:
  pgdata:
  ollama:
