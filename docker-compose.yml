# Triosteum целиком: база PostgreSQL + сервер.
#   cp .env.example .env    (поменяйте пароли!)
#   docker compose up -d --build
#   → http://localhost:8000
services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16}
    restart: unless-stopped
    environment:
      POSTGRES_DB: triosteum
      POSTGRES_USER: triosteum_owner
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?задайте DB_OWNER_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triosteum_owner -d triosteum"]
      interval: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # владелец схемы — только для миграций при запуске
      MIGRATE_DATABASE_URL: postgresql://triosteum_owner:${DB_OWNER_PASSWORD}@db:5432/triosteum
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?задайте APP_DB_PASSWORD в .env}
      # приложение работает ролью без права обходить построчную защиту
      DATABASE_URL: postgresql+psycopg://triosteum_app:${APP_DB_PASSWORD}@db:5432/triosteum
      COOKIE_SECURE: ${COOKIE_SECURE:-1}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      # ИИ: пусто — выключен; openai — своя модель (Ollama/vLLM); yandex — YandexGPT по ключу
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_BASE_URL: ${AI_BASE_URL:-http://ollama:11434/v1}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      YANDEX_API_KEY: ${YANDEX_API_KEY:-}
      YANDEX_FOLDER_ID: ${YANDEX_FOLDER_ID:-}
      # почта для приглашений и «Забыли пароль?» (необязательно)
      PUBLIC_URL: ${PUBLIC_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # задачи для ИИ из панели администратора: токен GitHub владельца (только этот репозиторий, Issues — чтение и запись)
      AGENTS_GITHUB_TOKEN: ${AGENTS_GITHUB_TOKEN:-}
      AGENTS_REPO: ${AGENTS_REPO:-LesNyXiX/triosteum}
      # Python-блоки выполняются в отдельном исполнителе
      RUNNER_URL: http://runner:8100
      RUNNER_TOKEN: ${RUNNER_TOKEN:?задайте RUNNER_TOKEN в .env}
    ports:
      # по умолчанию сервер доступен только с этой машины; наружу его выпускает Caddy (deploy/)
      - "${BIND_ADDR:-127.0.0.1}:${PORT:-8000}:8000"
    networks: [default, sandbox]

  # Исполнитель Python-блоков: без доступа к базе и интернету, только для чтения, минимум прав
  runner:
    build:
      context: .
      dockerfile: server/runner/Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
    restart: unless-stopped
    environment:
      RUNNER_TOKEN: ${RUNNER_TOKEN}
      RUN_TIMEOUT_SEC: ${RUN_TIMEOUT_SEC:-20}
      RUN_MEMORY_MB: ${RUN_MEMORY_MB:-512}
    networks: [sandbox]            # внутренняя сеть: только сервер Triosteum, без выхода в интернет
    read_only: true
    tmpfs:
      - /tmp:size=256m
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID]      # только чтобы каждый запуск сбрасывал права до nobody
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
    # ещё надёжнее — gVisor (https://gvisor.dev), если установлен на сервере:
    # runtime: runsc

  # своя модель на этом же сервере (нужна видеокарта NVIDIA или много памяти):
  #   docker compose --profile ai up -d
  #   docker compose exec ollama ollama pull qwen2.5-coder:14b
  # и в .env: AI_PROVIDER=openai, AI_MODEL=qwen2.5-coder:14b
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama}
    profiles: ["ai"]
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    # для видеокарты NVIDIA раскомментируйте:
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

networks:
  sandbox:
    internal: true

volumes:
  pgdata:
  ollama:
